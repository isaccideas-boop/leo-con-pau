<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf1" />
  <meta name="description" content="Leo con Pau: juego de sílabas, palabras y lectura para aprender a leer jugando." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Leo con Pau" />
  <title>Leo con Pau · Sílabas y palabras</title>

  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="bg-star s1">✦</span>
    <span class="bg-star s2">✦</span>
    <span class="bg-star s3">✦</span>
  </div>

  <main id="app"></main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div style="padding: 24px; font-family: sans-serif; text-align: center;">
      Para jugar con Pau necesitas activar JavaScript en el navegador.
    </div>
  </noscript>

  <script src="js/audio-id.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {
          /* La app sigue funcionando aunque el navegador no permita el modo offline. */
        });
      });
    }
  </script>
</body>
</html>
